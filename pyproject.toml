[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bacterial-genome-synteny-agent"
version = "2.0.0"
description = "Bacterial Genome Synteny Agent & Comparative Microbial Genomics Toolkit"
readme = "README.md"
authors = [{ name = "Comparative Genomics Research Group" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bacterial-genome-synteny-agent = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
