name: Bacterial Genome Synteny CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: Run CLI Smoke Tests
      run: |
        python cli.py --list-benchmarks
        python cli.py --benchmark ecoli_k12_vs_o157 --dotplot
        python cli.py --pangenome
        python cli.py --primers
        python cli.py batch -i sample.csv -o out_ci.csv
        python -c "import os; assert os.path.exists('out_ci.csv'); print('CLI Smoke Tests Passed!')"
        rm -f out_ci.csv
