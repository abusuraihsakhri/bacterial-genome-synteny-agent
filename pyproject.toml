[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bacterial-genome-synteny-engine"
version = "2.0.0"
description = "SyntenyMind: Whole-Genome Alignment & Inversion Breakpoint Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bacterial-genome-synteny-engine = "synteny_mind.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/bacterial-genome-synteny-engine"
Repository = "https://github.com/abusuraihsakhri/bacterial-genome-synteny-engine.git"
